}

function calcPts(m){
  if(m.actualH==null||m.actualA==null) return {rikki:0,reece:0};
  const ar = m.actualH>m.actualA?'H':m.actualH<m.actualA?'A':'D';
  const pr = m.rikkiH>m.rikkiA?'H':m.rikkiH<m.rikkiA?'A':'D';
  const er = m.reeceH>m.reeceA?'H':m.reeceH<m.reeceA?'A':'D';
  let r = ar===pr?(ar==='D'?1:3):0, e = ar===er?(ar==='D'?1:3):0;
  if(m.rikkiH===m.actualH&&m.rikkiA===m.actualA) r+=2;
  if(m.reeceH===m.actualH&&m.reeceA===m.actualA) e+=2;
  return {rikki:r,reece:e};
}

function render(){
  renderLadder();
  renderGames();
  renderHistory();
}

function renderLadder(){
  const s = {Rikki:{P:0,W:0,D:0,L:0,Ex:0,Pts:0},Reece:{P:0,W:0,D:0,L:0,Ex:0,Pts:0}};
  data.matches.forEach(m=>{
    if(m.actualH==null||m.actualA==null) return;
    const c = calcPts(m);
    ['Rikki','Reece'].forEach(p=>{
      const st = s[p], pts = p==='Rikki'?c.rikki:c.reece;
      st.P++; st.Pts+=pts;
      if((p==='Rikki'&&m.rikkiH===m.actualH&&m.rikkiA===m.actualA)||(p==='Reece'&&m.reeceH===m.actualH&&m.reeceA===m.actualA)) st.Ex++;
      const pr = p==='Rikki'?(m.rikkiH>m.rikkiA?'H':m.rikkiH<m.rikkiA?'A':'D'):(m.reeceH>m.reeceA?'H':m.reeceH<m.reeceA?'A':'D');
      const ar = m.actualH>m.actualA?'H':m.actualH<m.actualA?'A':'D';
      if(pr===ar) ar==='D'?st.D++:st.W++; else st.L++;
    });
  });
  const rows = Object.entries(s).map(([n,x])=>({n,...x})).sort((a,b)=>b.Pts-a.Pts||b.Ex-a.Ex||a.n.localeCompare(b.n));
  document.querySelector('#ladderTable tbody').innerHTML = rows.map((r,i)=>`
    <tr><td>${i+1}</td><td class="${i===0?'gold':''}">${r.n}</td><td>${r.P}</td><td>${r.W}</td><td>${r.D}</td><td>${r.L}</td><td>${r.Ex}</td><td><b>${r.Pts}</b></td></tr>
  `).join('');
}
